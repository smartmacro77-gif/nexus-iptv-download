name: SunsetTV - Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair fonte e aplicar LoginScreen
        run: |
          mkdir -p project
          unzip -o -q "SunsetTV-1.4-debug.apk" -d project
          if [ -f LoginScreen.kt ]; then
            cp LoginScreen.kt project/SunsetTV/app/src/main/java/com/sunsettv/ui/screens/LoginScreen.kt
            echo "LoginScreen.kt aplicado com sucesso."
          fi
          # Garantir otimização de memória no gradle.properties
          if [ -f project/SunsetTV/gradle.properties ]; then
            sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8|' project/SunsetTV/gradle.properties
          else
            echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" > project/SunsetTV/gradle.properties
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gerar wrapper e compilar APK
        working-directory: project/SunsetTV
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew :app:assembleDebug --no-daemon

      - name: Confirmar APK gerado
        working-directory: project/SunsetTV
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: project/SunsetTV/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK no repositorio
        run: |
          cp project/SunsetTV/app/build/outputs/apk/debug/app-debug.apk SunsetTV-1.4-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SunsetTV-1.4-debug.apk
          if git diff --cached --quiet; then echo "APK sem alteracoes."; else
            git commit -m "Build automatico: SunsetTV-1.4-debug.apk"
            git push
          fi
